# pacreact settings. This file is read from /etc/pac/pacreact.conf, then from
# ~/.config/pac/pacreact.conf, then from the current folder, each overriding the earlier. Settings
# come from these files only, not from the environment. Read when the daemon starts: restart it to
# apply. Settings with no value here follow something else (the font size, the compositor) or are
# off until set.

# --- Layout ---------------------------------------------------------------

# Where the stack sits: top-right, top-left, top, bottom-right, bottom-left, bottom.
#anchor = top-right

# Distance from the screen's edge to the stack: pixels (0-200), or a length with a unit that is
# the same on every screen: mm, in or pt (e.g. 4mm), or % of the screen's shorter side.
#margin = 12mm

# Volume, brightness and clock bars: center, or stack to show them in the stack.
#osd = center

# Show on this monitor (as in `hyprctl monitors`); unset lets the compositor choose.
# output = DP-1

# 0 makes the HUD fully click-through.
#click = 1

# --- Size and fonts ---------------------------------------------------------

# Text size, 0.5 to 2.5; 1 is the default 16 px. (font_size sets it in pixels.)
# text_scale = 1

# Text size in pixels (10-48), or a length such as 4mm, 0.16in, 12pt or 1%; everything scales with it.
#font_size = 16

# The smallest and the largest the smallest text on the HUD may be, as a number and a unit (mm, in,
# pt, px, or % of the screen's shorter side), the same size on every screen: a person who needs text
# of at least 3 mm sets text_size_min = 3mm. They hold whatever font_size or text_scale says, and
# make the whole HUD larger or smaller with the text, though not wider than the screen. A
# maximum under 2 mm or a minimum over 40 mm is taken to be a mistake. If the minimum is above the
# maximum, the minimum wins. Unset: no limit.
# text_size_min = 3mm
# text_size_max = 12mm

# Width of cards, toasts and sliders in pixels (200-1200) or a length such as 100mm or 4in; unset follows the font size (380).
# width = 380

# Font files (.ttf, .otf) for Latin text; unset is the built-in font.
# font = /usr/share/fonts/TTF/MyFont-Regular.ttf
# font_bold = /usr/share/fonts/TTF/MyFont-Bold.ttf

# Pin the render scale (1-4, fractions allowed); unset follows the compositor.
# scale = 1.5

# normal, or high for black and white with nothing dimmed.
#contrast = normal

# The language of the texts, e.g. pt or pt_BR; unset: the environment's.
# language = pt

# Fade in/out in milliseconds; 0 turns the fade off.
#fade_ms = 120
# reduce_motion = yes (in pac.conf too) turns the fade off whatever fade_ms says.

# --- Speech -----------------------------------------------------------------

# Speak what the HUD shows (toasts, notifications, the volume bar, the clock) through
# speech-dispatcher, for people who cannot see the screen: a warning or a critical one starts with
# that word. yes or no. Only in a build with SPEECH=speechd (the default); a build with
# SPEECH=none ignores it. With no, speech-dispatcher is not connected to at all.
#speech = yes

# --- Status icons -----------------------------------------------------------

# The icons that go with pacreact's own messages (volume, battery, network, headset...).
#   auto   Nerd Font glyphs where the font is found, the icon theme's otherwise
#   theme  the icon theme's only (no Nerd Font is read)
#   0      no status icons at all: the least memory, and the text keeps the room
#icons = auto

# Font file of the glyph icons (Nerd Fonts 3). Unset looks for Symbols Nerd Font
# (SymbolsNerdFont-Regular.ttf) under ~/.local/share/fonts, ~/.fonts and /usr/share/fonts.
# icon_font = /usr/share/fonts/TTF/SymbolsNerdFont-Regular.ttf

# Icon size in pixels (12-128) or a length such as 6mm. Unset is 24 at the default font size, scaled with it.
# icon_size = 24

# --- Alerts and watchers ----------------------------------------------------

# Seconds after start-up during which a repeat of a recent alert stays quiet; 0 turns it off.
#startup_grace = 60

# What is watched, and its thresholds (the temperature, the disk space, the network probe, Bluetooth, the lock keys, the
# webcam, the jacks) is pacreactd's: see pacreactd.conf. What is shown of it is chosen here.

# Printing toasts: 1, done (not the one for a job starting) or 0.
#print = 1

# What CUPS and the bus said (print_debug) is pacreactd's: see pacreactd.conf.

# USB device toasts: all, 0 for none, or kinds: camera, printer (and scanner), tablet, storage, audio, input, other.
#usb = all

# What an audio jack plug is called (jacks, jacks_debug) is pacreactd's to decide: see pacreactd.conf.

# The temperature, battery and memory thresholds are pacreactd's: see pacreactd.conf.

# --- Peeking at the time ----------------------------------------------------

# Minutes between the times the clock shows itself in the middle of the screen,
# counted from the hour: 30 is at :00 and :30 (1-60; 0 turns it off).
#clock_every = 30

# Minutes without input before you count as away (1-120).
#peek_idle = 5

# Minutes away that count as a break (1-720).
#peek_break = 15

# --- Sound ------------------------------------------------------------------

# 0 turns all sound off.
#sound = 1

# Program started with the sound file as its argument; unset is pw-play, else paplay.
# player = pw-play

# Sound for timers and alarms: a file path or a sound-theme name; empty or 0 is silent.
#alarm_sound = alarm-clock-elapsed

# Off unless set: a sound name or path, or 1 for the theme's default.
# notify_sound =
# alert_sound =
# sound_volume = 1
# sound_power = 1
# sound_devices = 1
# sound_network = 1
